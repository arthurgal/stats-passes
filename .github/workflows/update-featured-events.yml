name: Update Featured Events

on:
  schedule:
    - cron: '0 * * * *' # Hourly at minute 0 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-events
  cancel-in-progress: false

jobs:
  update-featured:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch featured events (upcoming fixtures)
        run: |
          python fetch_featured_events.py

      - name: Commit and push changes (featured-events.json)
        run: |
          if git diff --quiet -- featured-events.json; then
            echo "No featured events changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add featured-events.json
            git commit -m "chore(featured): update featured-events.json [skip ci]" || echo "Nothing new to commit"
            git push
          fi

