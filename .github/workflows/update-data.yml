name: Update Data Daily

on:
  schedule:
    - cron: '15 5 * * *'  # Diariamente às 05:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run SofaScore scraper
        run: |
          python sofascore_stats.py || echo "Scraper failed, continuing to try update_data.py"

      - name: Build load-data.js from latest JSON
        run: |
          python update_data.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- load-data.js; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add load-data.js sofascore_analysis_*.json || true
            git commit -m "chore(data): update load-data.js [skip ci]"
            git push
          fi

